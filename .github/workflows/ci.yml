name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: c2pass
          POSTGRES_PASSWORD: c2pass
          POSTGRES_DB: c2pass_tcf_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U c2pass" --health-interval 5s --health-retries 10
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          TEST_REDIS_URL: redis://localhost:6379
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier docker-compose.yml
        run: touch .env && S3_SSE_KEY=ci docker compose config -q
      - name: Construire les images
        run: S3_SSE_KEY=ci docker compose build api web
