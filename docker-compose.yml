# C2Pass : stack complète (cahier des charges §5). Lancer : docker compose up -d --build
# puis, une seule fois : docker compose exec api node dist/db/seed.js
# Logs are rotated so a long-running server never fills its disk.
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

services:
  postgres:
    restart: unless-stopped
    logging: *logging
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: c2pass
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-c2pass}
      POSTGRES_DB: c2pass_tcf
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U c2pass -d c2pass_tcf"]
      interval: 5s
      retries: 10

  mongo:
    restart: unless-stopped
    logging: *logging
    image: mongo:7
    volumes: [mongodata:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      retries: 10

  redis:
    restart: unless-stopped
    logging: *logging
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]

  # Stockage objet compatible S3 (SeaweedFS). Les images MinIO ne sont plus publiées sur Docker Hub.
  s3:
    restart: unless-stopped
    logging: *logging
    image: chrislusf/seaweedfs:4.48
    command: server -dir=/data -s3 -s3.config=/etc/seaweedfs/s3.json
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-c2pass}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-c2pass-s3-secret}
      # Clé maîtresse du chiffrement des fichiers au repos (SSE-S3), exigée par l'API.
      WEED_S3_SSE_KEK: ${S3_SSE_KEY:?Définissez S3_SSE_KEY dans .env (openssl rand -hex 32)}
    configs:
      - source: s3_identities
        target: /etc/seaweedfs/s3.json
    volumes: [s3data:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9333/cluster/status >/dev/null"]
      interval: 5s
      retries: 20

  s3-init:
    image: chrislusf/seaweedfs:4.48
    depends_on:
      s3: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "until echo 's3.bucket.create -name c2pass-media' | weed shell -master=s3:9333 >/dev/null 2>&1;
      echo 's3.bucket.list' | weed shell -master=s3:9333 2>/dev/null | grep -q c2pass-media; do sleep 2; done"

  api:
    restart: unless-stopped
    logging: *logging
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://c2pass:${POSTGRES_PASSWORD:-c2pass}@postgres:5432/c2pass_tcf
      MONGO_URL: mongodb://mongo:27017
      REDIS_URL: redis://redis:6379
      S3_BUCKET: c2pass-media
      S3_ENDPOINT: http://s3:8333
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-c2pass}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-c2pass-s3-secret}
    depends_on:
      postgres: { condition: service_healthy }
      mongo: { condition: service_healthy }
      redis: { condition: service_started }
      s3-init: { condition: service_completed_successfully }
    ports: ["4000:4000"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/health >/dev/null"]
      interval: 15s
      start_period: 20s
      retries: 5

  web:
    restart: unless-stopped
    logging: *logging
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_URL: http://api:4000
        # Public address and publisher identity shown on the legal pages (read when the site is built).
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_WEB_URL:-http://localhost:3000}
        NEXT_PUBLIC_LEGAL_COMPANY: ${LEGAL_COMPANY:-}
        NEXT_PUBLIC_LEGAL_FORM: ${LEGAL_FORM:-}
        NEXT_PUBLIC_LEGAL_REGISTRATION: ${LEGAL_REGISTRATION:-}
        NEXT_PUBLIC_LEGAL_ADDRESS: ${LEGAL_ADDRESS:-}
        NEXT_PUBLIC_LEGAL_DIRECTOR: ${LEGAL_DIRECTOR:-}
        NEXT_PUBLIC_LEGAL_HOST: ${LEGAL_HOST:-}
        NEXT_PUBLIC_CONTACT_EMAIL: ${CONTACT_EMAIL:-}
        NEXT_PUBLIC_PRIVACY_EMAIL: ${PRIVACY_EMAIL:-}
    depends_on:
      api: { condition: service_healthy }
    ports: ["3000:3000"]

volumes:
  pgdata:
  mongodata:
  redisdata:
  s3data:

configs:
  s3_identities:
    content: |
      {"identities":[{"name":"c2pass","credentials":[{"accessKey":"${S3_ACCESS_KEY_ID:-c2pass}","secretKey":"${S3_SECRET_ACCESS_KEY:-c2pass-s3-secret}"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
